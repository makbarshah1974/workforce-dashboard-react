name = "workforce-dashboard-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_URL = "https://workforce-dashboard.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "workforce-dashboard"
database_id = ""

[observability]
enabled = true

[build]
command = "pnpm run build"